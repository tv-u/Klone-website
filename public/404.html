<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KLONE — Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Single Page Application redirect script for GitHub Pages
      // Encodes pathname & search into query parameters and restores root index.html
      (function() {
        var pathSegmentsToKeep = 1; // 1 for GitHub project pages (e.g. /Klone-website/)
        var l = window.location;
        // Check if on GitHub Pages project domain
        if (l.hostname.indexOf('github.io') !== -1) {
          var path = l.pathname;
          var segments = path.split('/').filter(Boolean);
          var repoName = segments.length > 0 ? segments[0] : '';
          var redirectTarget = '/' + (repoName ? repoName + '/' : '') + '?' +
            (l.search ? l.search.slice(1) + '&' : '') +
            'p=' + encodeURIComponent(path.slice(repoName ? repoName.length + 1 : 0)) +
            (l.hash ? '&h=' + encodeURIComponent(l.hash.slice(1)) : '');
          l.replace(redirectTarget);
        } else {
          // Cloudflare Pages / custom root domain
          l.replace('/' + (l.search || '') + (l.hash || ''));
        }
      })();
    </script>
    <style>
      body {
        background: #050508;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
      }
      .loader {
        border: 3px solid rgba(255, 46, 147, 0.2);
        border-top: 3px solid #00ff88;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="loader"></div>
      <p style="color:#00ff88; font-weight:700; letter-spacing:0.05em;">LOADING KLONE...</p>
    </div>
  </body>
</html>
