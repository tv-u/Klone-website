  <!-- ==========================================
       KLONE DESIGN SYSTEM
  =========================================== -->
  <style>
    :root {
      color-scheme: dark;
      --background: #080b14;
      --surface: #111827;
      --surface-hover: #1b263b;
      --text: #f8fafc;
      --muted: #9ca3af;
      --accent: #f97316;
      --border: rgba(255,255,255,.09);
      --safe-top: env(safe-area-inset-top,0px);
      --safe-bottom: env(safe-area-inset-bottom,0px);
    }

    *,*::before,*::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      scrollbar-width: thin;
      scrollbar-color: #374151 var(--background);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding-bottom: var(--safe-bottom);
      overflow-x: clip;
      background: var(--background);
      color: var(--text);
      font-family: Inter,system-ui,-apple-system,
        BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img,video,iframe,canvas,svg {
      max-width: 100%;
    }

    img {
      height: auto;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,input,select,textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    #root {
      min-height: 100vh;
      isolation: isolate;
    }

    /* INITIAL LOADER */
    #klone-loader {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--background);
      text-align: center;
    }

    .klone-loader-inner {
      display: grid;
      justify-items: center;
      gap: 15px;
    }

    .klone-logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .klone-loader-text {
      color: var(--muted);
      font-size: 13px;
    }

    .klone-spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: klone-spin .8s linear infinite;
    }

    @keyframes klone-spin {
      to { transform: rotate(360deg); }
    }

    /* APP ERROR FALLBACK */
    #klone-error {
      display: none;
      max-width: 600px;
      margin: 50px auto;
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }

    #klone-error button {
      margin-top: 15px;
      padding: 12px 22px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: white;
      font-weight: 700;
    }

    /* AD CONTAINERS */
    .klone-ad {
      width: min(calc(100% - 24px),1100px);
      margin: 20px auto;
      text-align: center;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }

    .klone-ad:empty {
      display: none;
    }

    .klone-native {
      width: 100%;
      min-height: 0;
      margin: 0 auto;
    }

    /* NETWORK STATUS */
    #klone-network-status {
      display: none;
      position: fixed;
      z-index: 999999;
      bottom: calc(12px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.3);
    }

    @media(max-width:600px) {
      .klone-ad {
        width: calc(100% - 16px);
        margin: 14px auto;
      }
    }

    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>

  <!-- ==========================================
       SMARTLINK LOADER
  =========================================== -->
  <script>
  (() => {
    "use strict";

    const smartlinkPath = "/adsterra-smartlinks.js";

    if (document.querySelector(
      'script[src="' + smartlinkPath + '"]'
    )) return;

    const script = document.createElement("script");
    script.src = smartlinkPath;
    script.async = true;
    script.dataset.cfasync = "false";

    script.onerror = () => {
      console.warn("[KLONE] SmartLink script unavailable.");
    };

    document.body.appendChild(script);
  })();
  </script>

  <!-- ==========================================
       NETWORK STATUS
  =========================================== -->
  <div id="klone-network-status" role="status" aria-live="polite"></div>

  <!-- ==========================================
       REACT APPLICATION ENTRY
  =========================================== -->
  <script type="module">
    const errorPanel = document.getElementById("klone-error");

    try {
      await import("/assets/index-jJa4NzwI.js");

      // Allow React time to mount before checking the root.
      requestAnimationFrame(() => {
        const root = document.getElementById("root");

        if (root && root.querySelector("#klone-loader")) {
          console.warn("[KLONE] React has not replaced the loading fallback.");
        }
      });

    } catch (error) {
      console.error("[KLONE] Application startup failed:", error);

      if (errorPanel) {
        errorPanel.style.display = "block";
      }
    }
  </script>

  <!-- ==========================================
       GLOBAL ERROR & NETWORK MONITOR
  =========================================== -->
  <script>
  (() => {
    "use strict";

    const status = document.getElementById("klone-network-status");

    window.addEventListener("error", event => {
      console.error(
        "[KLONE ERROR]",
        event.message || event.error || "Unknown error"
      );
    });

    window.addEventListener("unhandledrejection", event => {
      console.error("[KLONE PROMISE ERROR]", event.reason);
    });

    window.addEventListener("offline", () => {
      status.textContent = "You are offline. Check your internet connection.";
      status.style.display = "block";
    });

    window.addEventListener("online", () => {
      status.textContent = "Connection restored.";
      status.style.display = "block";

      setTimeout(() => {
        status.style.display = "none";
      }, 2500);
    });

    console.info("[KLONE] Production document initialized.");
  })();
  </script>
